<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Einkauf</title>
  <meta name="theme-color" content="#2f7d4f">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <!-- The header and the add field stay at the top while the list scrolls
       beneath them, like the status bar at the bottom. -->
  <header class="top">
    <div class="top-inner">
      <div class="bar">
        <h1><img class="app-icon" src="/icons/icon.svg" alt=""><span id="app-name">Einkauf</span></h1>
        <div class="account" id="account" hidden>
          <button type="button" class="account-button" popovertarget="account-menu" aria-haspopup="menu">
            <span class="user-name" id="user-name"></span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="account-menu" id="account-menu" popover>
            <!-- Filled by app.js, which puts the name where the catalog text has it. -->
            <p class="menu-header" id="menu-header"><strong class="menu-user-name" id="menu-user-name"></strong></p>
            <button type="button" class="menu-item danger-text" id="logout">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M16 17l5-5-5-5M21 12H9"/></svg>
              <span data-i18n="account.logout"></span>
            </button>
          </div>
        </div>
      </div>
      <form class="add" id="add-form" hidden>
        <input type="text" id="new-item" name="text" maxlength="200" autocomplete="off" enterkeyhint="done"
          data-i18n-placeholder="add.placeholder" data-i18n-aria-label="add.label"
          role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false">
        <button type="submit" class="primary add-button" data-i18n-aria-label="add.submit" data-i18n-title="add.submit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <!-- Past purchases matching the typed text; filled by app.js. -->
        <div class="suggestions" id="suggestions" role="listbox" data-i18n-aria-label="suggestion.list" hidden></div>
      </form>
    </div>
  </header>

  <p class="status" id="status" role="status" hidden></p>

  <main>
    <section class="login" id="login-screen" hidden>
      <form id="login-form" novalidate>
        <!-- biome-ignore lint/a11y/useHeadingContent: app.js fills in the text from the catalog at start -->
        <h2 data-i18n="login.title"></h2>
        <p class="hint" id="login-hint" hidden></p>
        <!-- biome-ignore lint/a11y/noLabelWithoutControl: app.js fills in the text from the catalog at start -->
        <label>
          <span data-i18n="login.email"></span>
          <input type="email" name="email" autocomplete="username" required>
        </label>
        <!-- biome-ignore lint/a11y/noLabelWithoutControl: app.js fills in the text from the catalog at start -->
        <label>
          <span data-i18n="login.password"></span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <p class="error" id="login-error" role="alert" hidden></p>
        <button type="submit" class="primary" data-i18n="login.submit"></button>
      </form>
      <details class="install-hint">
        <summary data-i18n="install.title"></summary>
        <p data-i18n="install.intro"></p>
        <!-- biome-ignore lint/a11y/useHeadingContent: app.js fills in the text from the catalog at start -->
        <h3 data-i18n="install.ios.title"></h3>
        <ol>
          <li data-i18n="install.ios.step1"></li>
          <li data-i18n="install.ios.step2"></li>
          <li data-i18n="install.ios.step3"></li>
        </ol>
        <!-- biome-ignore lint/a11y/useHeadingContent: app.js fills in the text from the catalog at start -->
        <h3 data-i18n="install.android.title"></h3>
        <ol>
          <li data-i18n="install.android.step1"></li>
          <li data-i18n="install.android.step2"></li>
          <li data-i18n="install.android.step3"></li>
        </ol>
      </details>
    </section>

    <section class="list" id="list-screen" hidden>
      <ul class="items" id="items"></ul>
      <div class="empty" id="empty" hidden>
        <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l3-5M16 9l-3-5M4 9h16l-2 11H6z"/><path d="M9 14l2 2 4-4"/></svg>
        <p><strong data-i18n="empty.title"></strong> <span data-i18n="empty.prompt"></span></p>
      </div>
      <section class="done" id="done" hidden>
        <button type="button" class="done-toggle" id="done-toggle" aria-expanded="false" aria-controls="done-items">
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          <span id="done-label"></span>
        </button>
        <ul class="items" id="done-items" hidden></ul>
      </section>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <span class="indicator" id="connection-indicator" hidden>
        <span class="dot" aria-hidden="true"></span>
        <span class="indicator-text"></span>
      </span>
      <span class="indicator" id="sync-indicator" hidden>
        <span class="dot" aria-hidden="true"></span>
        <span class="indicator-text"></span>
      </span>
      <span class="version" id="app-version"></span>
    </div>
  </footer>

  <dialog class="confirm" id="confirm-logout" tabindex="-1">
    <form method="dialog">
      <p id="logout-question"></p>
      <div class="actions">
        <button type="submit" value="cancel" data-i18n="logout.cancel"></button>
        <button type="submit" value="logout" class="danger" data-i18n="logout.confirm"></button>
      </div>
    </form>
  </dialog>

  <template id="item-template">
    <li class="item">
      <!-- biome-ignore lint/a11y/noLabelWithoutControl: app.js fills in the item text when it renders the row -->
      <label class="toggle">
        <input type="checkbox">
        <span class="body">
          <span class="text"></span>
          <span class="meta"></span>
          <span class="pending" data-i18n="item.pending"></span>
        </span>
      </label>
      <button type="button" class="claim">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 4.5a1.5 1.5 0 0 1 3 0V11M14 5.5a1.5 1.5 0 0 1 3 0V12M17 8.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8l-2.7-3.6a1.5 1.5 0 0 1 2.4-1.8L8 15"/></svg>
      </button>
      <button type="button" class="more" data-i18n-aria-label="item.more" data-i18n-title="item.more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/></svg>
      </button>
    </li>
  </template>

  <!-- A row in edit mode. Editing happens in the list rather than in a
       dialog, so the phone keyboard never covers the field. -->
  <template id="edit-template">
    <li class="item is-editing">
      <form class="edit-form">
        <input type="text" class="edit-text" maxlength="200" autocomplete="off" enterkeyhint="done" data-i18n-aria-label="edit.text">
        <input type="text" class="edit-note" maxlength="200" autocomplete="off" enterkeyhint="done"
          data-i18n-placeholder="edit.note" data-i18n-aria-label="edit.note">
        <div class="edit-actions">
          <button type="button" class="edit-delete" data-i18n-aria-label="edit.delete" data-i18n-title="edit.delete">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
          </button>
          <button type="button" class="edit-cancel" data-i18n="edit.cancel"></button>
          <button type="submit" class="primary" data-i18n="edit.save"></button>
        </div>
      </form>
    </li>
  </template>
</body>
</html>
